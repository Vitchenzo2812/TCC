# Parâmetros de geração. CONGELAR depois do piloto (roteiro, seção 6).
model: claude-opus-5-5
effort: medium          # padrão do modelo: representa o uso típico
thinking:
  type: adaptive        # sempre ativo no Opus 5.5; mantido para registro
  display: summarized   # devolve um RESUMO do raciocínio (sem isso, o campo vem vazio)
max_tokens: 64000
n_samples: 5
# Não enviados de propósito: temperature, top_p, top_k (regra 2.1) e fallbacks
# (uma recusa seria respondida por outro modelo, o que contaminaria o caso; o parâmetro
# também é rejeitado pela Batch API).

benchmarks:
  mbpp:
    harness: evalplus
    evalplus_version: "0.3.1"
    dataset_version: "v0.2.0"
    dataset_file: data/raw/datasets/MbppPlus-v0.2.0.jsonl
    dataset_sha256: ee1701c904eb306523280b5a38a661d13248d16dd92d2e4fe2de36b519d3c413
    dataset_md5_evalplus: 92743def42b30b354a30898e4fa33fb0
    n_problems: 378
    prompt_template: prompts/mbpp_user.txt
  lcb:
    harness: livecodebench
    lcb_commit: 28fef95ea8c9f7a547c8329f2cd3d32b92c1fa24
    lcb_release: release_v6   # release completa: test.jsonl a test6.jsonl (decisão de 2026-10-29)
    dataset_files:            # sha256 
      - data/raw/datasets/lcb_test.jsonl
      - data/raw/datasets/lcb_test2.jsonl
      - data/raw/datasets/lcb_test3.jsonl
      - data/raw/datasets/lcb_test4.jsonl
      - data/raw/datasets/lcb_test5.jsonl
      - data/raw/datasets/lcb_test6.jsonl
    n_problems: 1055
    system_template: prompts/lcb_system.txt
    prompt_template: prompts/lcb_user.txt

pilot:
  seed: 42
  mbpp: 10
  lcb: {easy: 3, medium: 3, hard: 4}

evaluation:
  docker_cpus: 2
  docker_memory: 4g

batch_pricing_usd_per_mtok: {input: 2.0, output: 10.0}
budget_usd: 100
