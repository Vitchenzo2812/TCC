# Parâmetros de geração. CONGELAR depois do piloto (roteiro, seção 6).
model: claude-opus-5-5
effort: medium          # padrão do modelo: representa o uso típico
thinking:
  type: adaptive        # sempre ativo no Opus 5.5; mantido para registro
  display: summarized   # devolve um RESUMO do raciocínio (sem isso, o campo vem vazio)
max_tokens: 64000
n_samples: 5
# Não enviados de propósito: temperature, top_p, top_k (regra 2.1) e fallbacks
# (uma recusa seria respondida por outro modelo, o que contaminaria o caso; o parâmetro
# também é rejeitado pela Batch API).

